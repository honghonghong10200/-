<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  雷州市第四中学 · 初二6班 · 新春聚餐英雄帖（H5 单文件网页）
  ───────────────────────────────────────────────────────────────────────────
  使用方式：把本文件 index.html 与毕业合影 graduation.jpg 放在同一个文件夹，
  用微信内置浏览器打开（或部署到公网后发链接到微信群），即可看到完整流程：

      第1页  身份核验弹窗（必须填「班级=初二6班」+ 姓名，无法跳过）
      第2页  毕业合影（对应同学头像出现金色闪烁光晕，3 秒后自动跳转）
      第3页  国风红金「新春英雄帖」主页面（底部「确认报名赴宴」按钮）

  本文件为「单文件」：所有 CSS 样式与 JS 逻辑都内联在本文件里，
  不依赖任何外部库、无广告、无多余弹窗，移动端自适应。

  ─────────────────────────── 三大教程（新手必读） ───────────────────────────

  ① 如何替换毕业照片？
     方法一（最简单，推荐）：
         把你的新照片文件名改成 graduation.jpg，放到和 index.html 同一个
         文件夹里、覆盖掉原文件即可，无需改任何代码。
     方法二（想用别的文件名）：
         在下面 <img id="photo" src="graduation.jpg" ...> 里把 src 改成你的
         新文件名即可（同时建议更新下方 CONFIG.photoSrc）。
     方法三（真·单文件、把图片塞进代码里）：
         把图片转成 base64 字符串（可用任意在线“图片转 base64”工具，或
         Python 一行：base64.b64encode(open('x.jpg','rb').read())），
         然后把 src 改成  src="data:image/jpeg;base64,xxxxxx..." 即可。
     ⚠ 注意：换图后照片里每个人的位置都会变，请按 ② 的方法重新校准坐标。

  ② 如何新增其他同学（名字 + 头像坐标），实现对应头像发光？
     第 1 步：找到下方「STUDENT_MAP」配置区，按已有格式复制一行：
              "张三": { x: 50, y: 30 },
              （x、y 是百分比：头像中心在照片「从左往右 x%、从上往下 y%」处）
     第 2 步：获取某个同学的精确坐标（两种办法任选）：
           办法A（推荐，最省事）：在网址后面加  ?cal=1  打开“校准模式”，
                直接点一下照片里那个同学的头像，屏幕会弹出该点的坐标（x%、y%），
                复制填入 STUDENT_MAP 即可。
           办法B（手动量）：用图片工具打开原图，量出头像中心像素坐标，
                x% = 中心横向像素 ÷ 图片总宽 × 100
                y% = 中心纵向像素 ÷ 图片总高 × 100
     第 3 步：填好后刷新页面，在第 1 页输入该同学名字，即可看到对应头像发光。

  ③ 如何部署，生成微信里可以直接点开访问的链接？
     微信内置浏览器打开网页，必须是一个「公网网址」。最简单做法：
       方案A（免费、推荐）GitHub Pages：
            把 index.html 和 graduation.jpg 上传到一个 GitHub 仓库 →
            Settings → Pages → 选分支并保存，得到 https://用户名.github.io/仓库名/ 链接。
       方案B（免费、拖拽即用）Vercel / Netlify：
            注册后把整个文件夹拖进去，自动生成 https 链接。
       方案C（国内稳定）腾讯云 COS / 阿里云 OSS 静态网站托管：
            上传文件、开启静态网站托管，得到公网域名（若想长期在微信稳定访问，
            建议使用已备案域名并开启 https）。
     ⚠ 提示：微信对 https 支持最好；未备案域名在微信里可能被拦截。
        得到链接后，直接把链接发到班级微信群，同学们点开即可。
  ═══════════════════════════════════════════════════════════════════════════
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 移动端适配：禁止缩放、适配刘海屏 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>初二6班 · 新春英雄帖</title>
  <style>
    /* ===================== 全局样式 ===================== */
    :root {
      /* 国风红金配色（可自行微调） */
      --red-deep: #7a0e0e;      /* 深红（背景） */
      --red:      #a31621;      /* 正红 */
      --red-dark: #5f0a0a;      /* 更深的红（渐变用） */
      --gold:     #e8c26a;      /* 金色（主） */
      --gold-bright: #f5d98a;   /* 亮金 */
      --gold-deep: #b8860b;     /* 暗金 */
      --ink:      #3a1505;      /* 深褐（正文文字） */
      --paper:    #fdf3d8;      /* 米色纸面 */
      --font-title: "STKaiti", "KaiTi", "楷体", "STSong", "SimSun", "FangSong", serif;
      --font-body:  "PingFang SC", "Microsoft YaHei", "微软雅黑", sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      color: #fff;
      background: #000;
    }

    body {
      /* 喜庆红金渐变背景 + 隐约祥云质感（纯 CSS 模拟，不依赖图片） */
      background:
        radial-gradient(120% 80% at 50% 0%, #c5222a 0%, var(--red) 45%, var(--red-deep) 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    /* 所有“页”共用容器：手机满宽、桌面居中（最大 480px） */
    .page {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      display: none;
      padding: calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 24px);
      position: relative;
    }
    .page.active { display: block; }

    /* ===================== 第 1 页：身份核验弹窗 ===================== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(40, 0, 0, 0.82);        /* 半透明深色遮罩 */
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    /* 关键：核验弹窗本身没有任何“关闭/跳过”入口，只有填写正确后才能离开 */
    .modal.hidden { display: none; }

    .verify-card {
      width: 100%;
      max-width: 340px;
      background: linear-gradient(180deg, #fff6e0 0%, var(--paper) 100%);
      color: var(--ink);
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 26px 22px 22px;
      box-shadow: 0 0 0 5px rgba(232, 194, 106, .25), 0 16px 40px rgba(0,0,0,.45);
      position: relative;
      text-align: center;
    }
    /* 金边内框（双重描边，更显“帖”） */
    .verify-card::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid var(--gold);
      border-radius: 9px;
      pointer-events: none;
    }
    .verify-title {
      font-family: var(--font-title);
      font-size: 24px;
      font-weight: 700;
      color: var(--red);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .verify-sub {
      font-size: 12px;
      color: #8a6a2a;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }
    /* 表单字段 */
    .field { text-align: left; margin-bottom: 14px; }
    .field label {
      display: block;
      font-family: var(--font-title);
      font-size: 16px;
      color: var(--red);
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .field input {
      width: 100%;
      height: 46px;
      border: 1px solid #d9b96a;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      padding: 0 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(163, 22, 33, .12);
    }
    .field .hint {
      display: block;
      font-size: 12px;
      color: #c0392b;
      margin-top: 5px;
      min-height: 15px;
      letter-spacing: .5px;
    }
    /* “下一步”按钮：未通过校验时为灰色禁用态，通过后变红金可用态 */
    .btn-primary {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 24px;
      font-family: var(--font-title);
      font-size: 18px;
      letter-spacing: 3px;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(180deg, #c9c9c9, #a8a8a8);
      transition: transform .1s, box-shadow .2s;
    }
    .btn-primary.enabled {
      background: linear-gradient(180deg, var(--gold-bright), var(--gold-deep));
      color: #4a1a05;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(184, 134, 11, .5);
    }
    .btn-primary.enabled:active { transform: scale(.97); }

    /* ===================== 第 2 页：毕业合影（照片铺满手机屏幕） ===================== */
    /* 合影页去掉左右留白，让照片贴边铺满整个屏幕宽度 */
    #page-photo {
      padding: 0;
      max-width: 640px;
    }
    /* 照片容器：宽 100%，高度由图片自然撑开；发光层绝对定位覆盖其上 */
    .photo-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    /* 照片左上角的小标题徽章（悬浮在照片上，不占用版面，让照片更大） */
    .photo-badge {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 6;
      font-family: var(--font-title);
      font-size: 14px;
      letter-spacing: 2px;
      color: #fff;
      background: rgba(122, 14, 14, .8);
      padding: 4px 12px;
      border: 1px solid var(--gold);
      border-radius: 14px;
      pointer-events: none;
    }
    /* 照片下方（倒计时 / 提示）区域，单独加一点内边距 */
    .photo-below {
      padding: 14px 16px calc(env(safe-area-inset-bottom) + 20px);
    }
    #photo {
      display: block;
      width: 100%;
      height: auto;              /* 保持原图比例完整显示 */
      user-select: none;
      -webkit-user-drag: none;
    }
    /* 发光层：与照片完全重叠，坐标百分比与「原图」一一对应 */
    #glowLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;       /* 让点击穿透到照片，供校准模式使用 */
    }
    /* 金色闪烁光晕 */
    .glow {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }
    .glow-core {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(255, 240, 160, .95) 0%,
        rgba(255, 205, 70, .60) 35%,
        rgba(255, 160, 0, .30) 58%,
        rgba(255, 160, 0, 0) 74%);
      filter: blur(1px);
      animation: glowPulse 1.6s ease-in-out infinite;
    }
    .glow-ring {
      position: absolute;
      inset: -12%;
      border-radius: 50%;
      border: 2px solid rgba(255, 220, 100, .85);
      box-shadow: 0 0 16px 4px rgba(255, 200, 60, .75), inset 0 0 12px 3px rgba(255, 220, 120, .6);
      animation: glowPulse 1.6s ease-in-out infinite;
    }
    /* 旋转流光：营造“闪烁”感 */
    .glow-spark {
      position: absolute;
      inset: -18%;
      border-radius: 50%;
      background: conic-gradient(from 0deg,
        rgba(255,255,255,0) 0deg,
        rgba(255,255,220,.9) 40deg,
        rgba(255,220,90,0) 90deg,
        rgba(255,255,255,0) 360deg);
      filter: blur(1px);
      animation: spin 2.6s linear infinite;
    }
    .glow-label {
      position: absolute;
      left: 50%;
      top: 108%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-family: var(--font-title);
      font-size: 12px;
      color: #4a1a05;
      background: linear-gradient(180deg, var(--gold-bright), var(--gold));
      border: 1px solid #fff8;
      border-radius: 10px;
      padding: 1px 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.35);
      letter-spacing: 1px;
    }
    @keyframes glowPulse {
      0%, 100% { transform: scale(.9); opacity: .75; }
      50%      { transform: scale(1.14); opacity: 1; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 倒计时提示条 */
    .countdown-bar {
      margin-top: 16px;
      text-align: center;
      font-family: var(--font-title);
      font-size: 17px;
      letter-spacing: 2px;
      color: var(--gold-bright);
      text-shadow: 0 1px 4px rgba(0,0,0,.4);
    }
    .countdown-bar b {
      display: inline-block;
      min-width: 1.2em;
      font-size: 22px;
      color: #fff;
    }
    .countdown-track {
      margin: 8px auto 0;
      width: 70%;
      max-width: 260px;
      height: 5px;
      border-radius: 3px;
      background: rgba(255,255,255,.25);
      overflow: hidden;
    }
    .countdown-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--gold), var(--gold-bright));
      transition: width 1s linear;
    }
    /* 未找到姓名时的温和提示（非弹窗，不打断流程） */
    .photo-note {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: #ffe9b0;
      letter-spacing: 1px;
    }
    /* 校准模式读数框 */
    #calReadout {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 18px);
      transform: translateX(-50%);
      z-index: 2000;
      background: rgba(20, 0, 0, .88);
      color: var(--gold-bright);
      font-size: 13px;
      letter-spacing: 1px;
      padding: 8px 14px;
      border: 1px solid var(--gold);
      border-radius: 18px;
      display: none;
      white-space: nowrap;
    }

    /* ===================== 第 3 页：英雄帖主页面 ===================== */
    .hero-card {
      position: relative;
      background: linear-gradient(180deg, #b01e28 0%, var(--red) 60%, var(--red-deep) 100%);
      border: 3px double var(--gold);
      border-radius: 10px;
      padding: 30px 20px 26px;
      box-shadow: 0 0 0 4px rgba(232, 194, 106, .18), 0 18px 44px rgba(0,0,0,.5);
      text-align: center;
      margin-top: 8px;
    }
    /* 四角金色“回纹”装饰点 */
    .hero-card::before,
    .hero-card::after {
      content: "❖";
      position: absolute;
      color: var(--gold);
      font-size: 16px;
      line-height: 1;
    }
    .hero-card::before { top: 8px; left: 12px; }
    .hero-card::after  { top: 8px; right: 12px; }
    .hero-corner { position: absolute; color: var(--gold); font-size: 16px; line-height: 1; }
    .hero-corner.bl { bottom: 8px; left: 12px; }
    .hero-corner.br { bottom: 8px; right: 12px; }

    .hero-title {
      font-family: var(--font-title);
      font-size: 30px;
      font-weight: 700;
      color: var(--gold-bright);
      letter-spacing: 4px;
      text-shadow: 0 2px 0 #7a0e0e, 0 4px 12px rgba(0,0,0,.5);
      margin-bottom: 6px;
    }
    .hero-divider {
      width: 72%;
      height: 2px;
      margin: 6px auto 16px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .hero-subtitle {
      font-family: var(--font-title);
      font-size: 15px;
      color: #ffe9b0;
      letter-spacing: 6px;
      margin-bottom: 20px;
    }
    .hero-body {
      font-family: var(--font-title);
      font-size: 17px;
      line-height: 1.9;
      color: #fff5da;
      letter-spacing: 1.5px;
      text-align: left;
      padding: 0 6px;
    }
    .hero-body .lead { font-size: 20px; color: var(--gold-bright); font-weight: 700; }
    .hero-greet {
      margin-top: 16px;
      font-size: 15px;
      color: #ffe9b0;
    }
    /* 聚餐信息预留区（聚餐时间/地点，改这里即可） */
    .info-box {
      margin: 18px 0;
      padding: 14px 12px;
      border: 1px dashed var(--gold);
      border-radius: 8px;
      background: rgba(90, 5, 5, .35);
      text-align: left;
      font-family: var(--font-title);
      font-size: 16px;
      line-height: 2;
      color: #fff0c8;
      letter-spacing: 1px;
    }
    .info-box .info-tag {
      display: inline-block;
      color: var(--gold-bright);
      font-weight: 700;
      margin-right: 6px;
    }
    .signup-btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 26px;
      background: linear-gradient(180deg, var(--gold-bright), var(--gold-deep));
      color: #4a1a05;
      font-family: var(--font-title);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(184, 134, 11, .55);
      margin-top: 6px;
      transition: transform .1s;
    }
    .signup-btn:active { transform: scale(.97); }
    .signup-tip {
      margin-top: 10px;
      font-size: 12px;
      color: #ffe9b0;
      letter-spacing: 1px;
      opacity: .9;
    }

    /* ===================== 感谢回执（报名成功后弹出） ===================== */
    .receipt-card {
      width: 100%;
      max-width: 300px;
      background: linear-gradient(180deg, #fff6e0, var(--paper));
      color: var(--ink);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 26px 20px 20px;
      box-shadow: 0 0 0 5px rgba(232,194,106,.25), 0 16px 40px rgba(0,0,0,.5);
      text-align: center;
    }
    .receipt-card .stamp {
      display: inline-block;
      font-family: var(--font-title);
      font-size: 18px;
      color: var(--red);
      border: 3px solid var(--red);
      border-radius: 6px;
      padding: 4px 12px;
      letter-spacing: 3px;
      transform: rotate(-8deg);
      margin-bottom: 14px;
      opacity: .9;
    }
    .receipt-card .msg {
      font-family: var(--font-title);
      font-size: 16px;
      line-height: 1.9;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }
    .receipt-card .msg b { color: var(--red); }
    .btn-ok {
      display: inline-block;
      padding: 9px 34px;
      border: 1px solid var(--gold-deep);
      border-radius: 20px;
      background: linear-gradient(180deg, var(--red), var(--red-dark));
      color: #fff;
      font-family: var(--font-title);
      font-size: 16px;
      letter-spacing: 3px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ═══════════ 第 1 页：身份核验弹窗（无法关闭跳过） ═══════════ -->
  <div id="verifyModal" class="modal" role="dialog" aria-modal="true">
    <div class="verify-card">
      <div class="verify-title">身份核验</div>
      <div class="verify-sub">同学，请先核验身份</div>

      <div class="field">
        <label for="classInput">班级</label>
        <input id="classInput" type="text" maxlength="10" placeholder="请填写初二6班" autocomplete="off" enterkeyhint="next" />
        <span id="classHint" class="hint"></span>
      </div>

      <div class="field">
        <label for="nameInput">姓名</label>
        <input id="nameInput" type="text" maxlength="20" placeholder="请填写你的名字" autocomplete="off" enterkeyhint="go" />
        <span id="nameHint" class="hint"></span>
      </div>

      <!-- “下一步”按钮：校验不通过时是灰色禁用态，无法生效 -->
      <button id="verifyBtn" class="btn-primary" type="button" disabled>下一步</button>
    </div>
  </div>

  <!-- ═══════════ 第 2 页：毕业合影 + 发光 + 倒计时 ═══════════ -->
  <section id="page-photo" class="page">

  <!-- 校准模式读数框 -->
  <div id="calReadout"></div>

  <script>
  (function () {
    'use strict';

    /* ══════════════════════════════════════════════════════════════
       配置区（重要：新手主要改这里）
       ══════════════════════════════════════════════════════════════ */
    const CONFIG = {
      className: '初二6班',          // 班级核验的正确答案（必须完全一致，输入框里会先去掉首尾空格再比较）
      photoSrc:  '',   // 已内嵌 base64，无需外部图片文件
      countdownSeconds: 3,           // 第2页停留多少秒后自动跳转到英雄帖
      haloSizePct: 11,               // 光晕直径占“照片宽度”的百分比，数值越大光晕越大
    };

    /* 发光坐标表：名字 -> 头像中心位置（百分比）
       x = 头像中心在照片“从左往右”的 x% 处
       y = 头像中心在照片“从上往下”的 y% 处
       ── 如何新增同学，见文件最顶部的教程 ② ──
       示例：陈俊宏在最上面一排（后排），从右往左第 3 个人 → (x≈74.3%, y≈13.6%)
    */
    const STUDENT_MAP = {
      '陈俊宏': { x: 74.3, y: 13.6 },
      // '张三': { x: 50, y: 30 },   // ← 以后新增同学，复制上面这行、改成对应名字和坐标即可
    };

    /* 校准模式：网址后加 ?cal=1 可开启，点击照片任意位置会显示该点坐标（详见教程 ②） */
    const CAL_MODE = /[?&]cal(=1)?/.test(location.search);

    /* ══════════════════════════════════════════════════════════════
       小工具
       ══════════════════════════════════════════════════════════════ */
    const $ = function (id) { return document.getElementById(id); };

    // 转义 HTML，防止用户输入的姓名被当作 HTML 注入（安全校验）
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // 去掉首尾空格
    function trim(s) { return String(s == null ? '' : s).trim(); }

    // 页面切换：只显示指定页面，其余隐藏
    function showPage(id) {
      ['page-photo', 'page-hero'].forEach(function (pid) {
        $(pid).classList.toggle('active', pid === id);
      });
    }

    /* ══════════════════════════════════════════════════════════════
       第 1 页：身份核验
       ══════════════════════════════════════════════════════════════ */
    const classInput = $('classInput');
    const nameInput  = $('nameInput');
    const classHint  = $('classHint');
    const nameHint   = $('nameHint');
    const verifyBtn  = $('verifyBtn');

    // 校验规则：班级必须等于「初二6班」，姓名不能为空
    function validate() {
      const classOk = trim(classInput.value) === CONFIG.className;
      const nameOk  = trim(nameInput.value) !== '';
      return { classOk: classOk, nameOk: nameOk, valid: classOk && nameOk };
    }

    // 实时刷新：提示文案 + 按钮可用状态
    function updateVerify() {
      const v = validate();

      // 班级提示（仅当已输入且不正确时提醒，避免一进来就报错）
      classHint.textContent = (!v.classOk && classInput.value !== '') ? '请填写「' + CONFIG.className + '」' : '';
      // 姓名提示
      nameHint.textContent  = (!v.nameOk && nameInput.value !== '') ? '姓名不能为空' : '';

      verifyBtn.classList.toggle('enabled', v.valid);
      verifyBtn.disabled = !v.valid;   // 不满足条件时按钮禁用，无法生效
    }

    classInput.addEventListener('input', updateVerify);
    nameInput.addEventListener('input', updateVerify);

    // 手机键盘点“前往/完成”时，若校验通过则直接进入
    nameInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && validate().valid) { submitVerify(); }
    });

    function submitVerify() {
      const v = validate();
      if (!v.valid) {
        // 强行点击时把提示补全（正常情况按钮是禁用态，不会走到这里）
        if (!v.classOk) classHint.textContent = '请填写「' + CONFIG.className + '」';
        if (!v.nameOk)  nameHint.textContent  = '姓名不能为空';
        return;
      }
      const name = trim(nameInput.value);   // 记录姓名，供第2、3页使用
      startPhotoPage(name);
    }

    verifyBtn.addEventListener('click', submitVerify);

    /* ══════════════════════════════════════════════════════════════
       第 2 页：毕业合影（发光 + 倒计时）
       ══════════════════════════════════════════════════════════════ */
    let countdownTimer = null;

    function startPhotoPage(name) {
      $('verifyModal').classList.add('hidden');   // 关闭核验弹窗
      showPage('page-photo');
      renderGlow(name);
      startCountdown();
    }

    // 根据姓名渲染对应头像的发光光晕
    function renderGlow(name) {
      const layer = $('glowLayer');
      layer.innerHTML = '';                      // 先清空旧光晕
      const note = $('photoNote');
      note.style.display = 'none';

      const info = STUDENT_MAP[name];
      if (!info) {
        // 姓名不在配置表里：温和提示，不打断流程（仍会倒计时进入英雄帖）
        note.textContent = '未找到「' + name + '」的发光位置，请核对姓名（可联系组织者补充坐标）';
        note.style.display = 'block';
        return;
      }

      const g = document.createElement('div');
      g.className = 'glow';
      g.style.left = info.x + '%';               // 头像中心横坐标（百分比）
      g.style.top  = info.y + '%';               // 头像中心纵坐标（百分比）
      const sizePct = info.size || CONFIG.haloSizePct;
      g.dataset.sizePct = String(sizePct);
      // 光晕由三层组成：核心柔光 + 金环 + 旋转流光，并带上名字小标签
      g.innerHTML =
        '<i class="glow-core"></i>' +
        '<i class="glow-ring"></i>' +
        '<i class="glow-spark"></i>' +
        '<span class="glow-label">' + escapeHtml(name) + '</span>';
      layer.appendChild(g);

      layoutGlows();
    }

    // 把光晕的“百分比直径”换算成像素，保证在任意屏幕宽度下都成比例缩放
    function layoutGlows() {
      const layer = $('glowLayer');
      const w = layer.clientWidth;
      if (!w) return;
      layer.querySelectorAll('.glow').forEach(function (g) {
        const px = Math.max(18, w * parseFloat(g.dataset.sizePct) / 100);
        g.style.width  = px + 'px';
        g.style.height = px + 'px';
      });
    }
    window.addEventListener('resize', layoutGlows);
    window.addEventListener('orientationchange', layoutGlows);

    // 3 秒倒计时，结束后自动进入英雄帖
    function startCountdown() {
      let remain = CONFIG.countdownSeconds;
      const numEl = $('countdownNum');
      const fillEl = $('countdownFill');
      numEl.textContent = remain;
      // 让进度条先归零再开始（宽度过渡由 CSS 控制）
      requestAnimationFrame(function () {
        fillEl.style.width = '100%';
      });

      countdownTimer = setInterval(function () {
        remain -= 1;
        numEl.textContent = Math.max(remain, 0);
        if (remain <= 0) {
          clearInterval(countdownTimer);
          startHeroPage(trim(nameInput.value));
        }
      }, 1000);
    }

    /* 校准模式：点击照片显示坐标（网址后加 ?cal=1 开启） */
    if (CAL_MODE) {
      const readout = $('calReadout');
      $('photoWrap').style.cursor = 'crosshair';
      $('photoWrap').addEventListener('click', function (e) {
        const rect = this.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        const msg = 'x:' + x.toFixed(1) + '% , y:' + y.toFixed(1) + '%';
        readout.textContent = '坐标 ' + msg + '（已复制）';
        readout.style.display = 'block';
        // 尝试复制到剪贴板，失败则忽略（不影响使用）
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(msg).catch(function () {});
        }
      });
    }

    /* ══════════════════════════════════════════════════════════════
       第 3 页：英雄帖主页面
       ══════════════════════════════════════════════════════════════ */
    function startHeroPage(name) {
      showPage('page-hero');
      $('heroName').textContent = escapeHtml(name) || '同学';
    }

    // 报名：提交姓名（当前为纯前端演示，直接弹出感谢回执；
    // 如需真实收集报名，可在此处调用后端接口 / 问卷链接，见下方注释）
    function submitSignup() {
      const name = trim(nameInput.value) || '同学';
      $('receiptName').textContent = escapeHtml(name);
      $('receiptModal').classList.remove('hidden');

      /*
       * 想真正收集报名信息？任选其一：
       * 1) 表单平台（腾讯问卷/金数据/问卷星）：
       *    把下面的链接换成你的表单链接，点击报名时跳转填写：
       *    window.location.href = 'https://你的表单链接';
       * 2) 自建后端接口（例如云函数/服务器），用 fetch 提交姓名：
       *    fetch('https://你的接口地址/signup', {
       *      method: 'POST',
       *      headers: { 'Content-Type': 'application/json' },
       *      body: JSON.stringify({ name: name })
       *    }).then(r => r.json()).then(d => { ... }).catch(err => { ... });
       */
    }

    $('signupBtn').addEventListener('click', submitSignup);
    $('receiptOk').addEventListener('click', function () {
      $('receiptModal').classList.add('hidden');
    });

    /* ══════════════════════════════════════════════════════════════
       初始化：页面加载即弹出核验弹窗（弹窗默认可见、无关闭入口）
       ══════════════════════════════════════════════════════════════ */
    // 阻止 Esc 关闭（核验弹窗本就没有关闭按钮，这里再兜底一次）
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !$('verifyModal').classList.contains('hidden')) {
        e.preventDefault();
      }
    });
    // 初始只显示核验弹窗，第2、3页隐藏，等待核验通过
    updateVerify();
    classInput.focus();
  })();
  </script>
</body>
</html>
